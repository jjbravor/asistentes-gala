<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Asistentes</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 750px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin: 20px auto; }
    .hidden { display: none !important; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 2px solid #f1f1f1; }
    h2 { margin: 0; color: #2c3e50; font-size: 22px; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-main { background-color: #007bff; color: white; }
    .btn-main:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; width: 100%; padding: 14px; font-size: 16px; justify-content: center; }
    .btn-success:hover { background-color: #218838; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #5a6268; }
    .btn-info { background-color: #17a2b8; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-info:hover { background-color: #138496; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 14px; border-bottom: 1px solid #eef2f5; }
    th { background-color: #f8f9fa; color: #5a6c7d; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:hover { background-color: #fafbfc; }
    .badge { background-color: #007bff; color: white; padding: 4px 10px; border-radius: 50px; font-size: 13px; font-weight: bold; }
    .badge-vacio { background-color: #6c757d; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #4a5568; }
    select, input, textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 15px; background-color: #fff; }
    select:focus, input:focus, textarea:focus { border-color: #3182ce; outline: none; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
    input:disabled { background-color: #edf2f7; color: #4a5568; cursor: not-allowed; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 650px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .status-msg { margin-top: 20px; font-weight: bold; text-align: center; font-size: 15px; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LISTADO PRINCIPAL -->
  <div id="vistaPrincipal" class="container">
    <div class="header-row">
      <h2>Listado de Titulares (Hoja1)</h2>
      <button class="btn btn-main" id="btnIrAgregar">➕ Agregar Registro</button>
    </div>
    <div id="cargaPrincipal" class="status-msg">Cargando base de datos...</div>
    <table id="tablaTitulares" class="hidden">
      <thead>
        <tr>
          <th>Nombre del Titular</th>
          <th style="text-align: center;">Invitados Registrados</th>
          <th style="text-align: right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTitulares"></tbody>
    </table>
  </div>

  <!-- PANTALLA 2: FORMULARIO -->
  <div id="vistaFormulario" class="container hidden">
    <div class="header-row">
      <h2>Nuevo Registro de Asistente (Hacia Hoja2)</h2>
      <button class="btn btn-secondary" id="btnVolver">⬅ Volver al Listado</button>
    </div>
    <form id="formularioRegistro">
      <div class="form-group">
        <label for="titular">Titular Responsable:</label>
        <select id="titular" required>
          <option value="">Cargando lista de titulares...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="nombreasistente">Nombre del Asistente / Invitado:</label>
        <input type="text" id="nombreasistente" required placeholder="Nombre completo del asistente">
      </div>
      <div class="form-group">
        <label for="rut">RUT:</label>
        <input type="text" id="rut" required placeholder="12.345.678-9" maxlength="12">
      </div>
      <div class="form-group">
        <label for="fechanacimiento">Fecha de Nacimiento (DD/MM/YYYY):</label>
        <input type="text" id="fechanacimiento" required placeholder="DD/MM/YYYY" maxlength="10">
      </div>
      <div class="form-group">
        <label for="edad">Edad Calculada:</label>
        <input type="number" id="edad" required readonly placeholder="Se calcula automáticamente">
      </div>
      <div class="form-group">
        <label for="restriccionalimentaria">Restricción Alimentaria:</label>
        <select id="restriccionalimentaria" required>
          <option value="Ninguna">Ninguna</option>
          <option value="Vegetariano">Vegetariano</option>
          <option value="Vegano">Vegano</option>
          <option value="Celíaco (Sin gluten)">Celíaco (Sin gluten)</option>
          <option value="Intolerante a la lactosa">Intolerante a la lactosa</option>
          <option value="Otro">Otro (Especificar en observaciones)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones adicionales:</label>
        <textarea id="observaciones" rows="3" placeholder="Detalles adicionales..."></textarea>
      </div>
      <button type="submit" class="btn btn-success" id="btnEnviar">💾 Guardar Registro en Hoja2</button>
    </form>
    <div id="mensajeForm" class="status-msg"></div>
  </div>

  <!-- POP-UP FLOTANTE -->
  <div id="modalInvitados" class="modal hidden">
    <div class="modal-content">
      <div class="header-row" style="border-bottom: 1px solid #eee; margin-bottom: 15px;">
        <h3 id="modalTitulo" style="margin:0; color:#1a202c;">Invitados del Titular</h3>
        <button class="btn btn-secondary" id="btnCerrarModal" style="padding: 5px 10px;">Cerrar</button>
      </div>
      <div id="cuerpoModal" style="margin-top: 10px;">Cargando lista filtrada...</div>
    </div>
  </div>
    <script>
    // ⚠️ REEMPLAZA ESTA URL CON TU ENLACE DE GOOGLE APPS SCRIPT (/exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxTC6cjZLsfzRl-7q3G3ZqM1alZmmPycwqt5tu3afQggXKBWdURzBjAx56exzhEvdg/exec";

    const vistaPrincipal = document.getElementById('vistaPrincipal');
    const vistaFormulario = document.getElementById('vistaFormulario');
    const modalInvitados = document.getElementById('modalInvitados');
    const cuerpoTitulares = document.getElementById('cuerpoTitulares');
    const tablaTitulares = document.getElementById('tablaTitulares');
    const cargaPrincipal = document.getElementById('cargaPrincipal');
    const selectTitular = document.getElementById('titular');
    const inputFecha = document.getElementById('fechanacimiento');
    const inputEdad = document.getElementById('edad');
    const inputRut = document.getElementById('rut');
    const form = document.getElementById('formularioRegistro');
    const mensajeForm = document.getElementById('mensajeForm');

    document.getElementById('btnIrAgregar').addEventListener('click', () => {
      vistaPrincipal.classList.add('hidden');
      vistaFormulario.classList.remove('hidden');
      mensajeForm.textContent = "";
    });

    document.getElementById('btnVolver').addEventListener('click', () => {
      vistaFormulario.classList.add('hidden');
      vistaPrincipal.classList.remove('hidden');
      cargarPantallaPrincipal(); 
    });

    document.getElementById('btnCerrarModal').addEventListener('click', () => {
      modalInvitados.classList.add('hidden');
    });

    // MÁSCARA AUTOMÁTICA FECHA Y DISPARO DE EDAD
    inputFecha.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, ''); 
      if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
      if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
      e.target.value = v;

      if (v.length === 10) {
        calcularEdadAutomatica(v);
      } else {
        inputEdad.value = ""; 
      }
    });

    function calcularEdadAutomatica(fechaTexto) {
      const partes = fechaTexto.split('/');
      const dia = parseInt(partes[0], 10);
      const mes = parseInt(partes[1], 10) - 1;
      const ano = parseInt(partes[2], 10);
      if (isNaN(dia) || isNaN(mes) || isNaN(ano) || ano < 1900 || mes > 11 || dia > 31) return;
      
      const hoy = new Date();
      const cumpleanos = new Date(ano, mes, dia);
      let edadCalculada = hoy.getFullYear() - cumpleanos.getFullYear();
      const m = hoy.getMonth() - cumpleanos.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < cumpleanos.getDate())) {
        edadCalculada--;
      }
      inputEdad.value = edadCalculada >= 0 ? edadCalculada : "";
    }

    // FORMATEADOR DE RUT AUTOMÁTICO
    inputRut.addEventListener('input', (e) => {
      let v = e.target.value.replace(/[^0-9kK]/g, '');
      if (v.length < 2) { e.target.value = v; return; }
      let cuerpo = v.slice(0, -1);
      let dv = v.slice(-1).toUpperCase();
      if (cuerpo.length > 3 && cuerpo.length <= 6) {
        cuerpo = cuerpo.slice(0, -3) + '.' + cuerpo.slice(-3);
      } else if (cuerpo.length > 6) {
        cuerpo = cuerpo.slice(0, -6) + '.' + cuerpo.slice(-6, -3) + '.' + cuerpo.slice(-3);
      }
      e.target.value = cuerpo + '-' + dv;
    });

    async function cargarPantallaPrincipal() {
      try {
        cargaPrincipal.classList.remove('hidden');
        cargaPrincipal.textContent = "Sincronizando con Google Sheets...";
        tablaTitulares.classList.add('hidden');

        const respuesta = await fetch(WEB_APP_URL);
        const res = await respuesta.json();
        cuerpoTitulares.innerHTML = "";
        const listaDatos = res.datos || [];

        listaDatos.forEach(titular => {
          const fila = document.createElement('tr');
          const tieneInvitados = titular.cantidad > 0;
          fila.innerHTML = `
            <td><strong>${titular.nombre}</strong></td>
            <td style="text-align: center;"><span class="badge ${tieneInvitados ? '' : 'badge-vacio'}">${titular.cantidad}</span></td>
            <td style="text-align: right;">
              <button class="btn btn-info" onclick="verInvitados('${titular.nombre}')">👁️ Ver Invitados</button>
            </td>
          `;
          cuerpoTitulares.appendChild(fila);
        });

        selectTitular.innerHTML = '<option value="">-- Seleccione un Titular --</option>';
        listaDatos.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.nombre; opt.textContent = t.nombre;
          selectTitular.appendChild(opt);
        });

        cargaPrincipal.classList.add('hidden');
        tablaTitulares.classList.remove('hidden');
      } catch (error) {
        cargaPrincipal.textContent = "Error de comunicación con el Apps Script.";
      }
    }

    async function verInvitados(nombreTitular) {
      document.getElementById('modalTitulo').innerHTML = `Invitados vinculados a:<br><span style="color:#007bff;">${nombreTitular}</span>`;
      const cuerpoModal = document.getElementById('cuerpoModal');
      cuerpoModal.innerHTML = "Buscando coincidencias en la Hoja2...";
      modalInvitados.classList.remove('hidden');

      try {
        const respuesta = await fetch(`${WEB_APP_URL}?titular=${encodeURIComponent(nombreTitular)}`);
        const res = await respuesta.json();

        if (!res.invitados || res.invitados.length === 0) {
          cuerpoModal.innerHTML = "<p style='text-align:center;color:#718096;padding:20px;'>Este titular aún no tiene ningún invitado registrado en la Hoja2.</p>";
          return;
        }

        let htmlTabla = `<table><thead><tr><th>Asistente / Edad</th><th>RUT</th><th>Restricción</th></tr></thead><tbody>`;
        res.invitados.forEach(inv => {
          htmlTabla += `<tr>
            <td><strong>${inv.nombreasistente}</strong><br><small style="color:#718096">Edad: ${inv.edad} años (${inv.fechanacimiento})</small></td>
            <td><code>${inv.rut}</code></td>
            <td><span style="font-size:13px;">${inv.restriccionalimentaria}</span>${inv.observaciones ? `<br><small style="color:#e53e3e">Obs: ${inv.observaciones}</small>` : ''}</td>
          </tr>`;
        });
        htmlTabla += `</tbody></table>`;
        cuerpoModal.innerHTML = htmlTabla;
      } catch (e) {
        cuerpoModal.innerHTML = "Error al decodificar la lista de invitados.";
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (inputFecha.value.length < 10) { alert("Completa la fecha en formato DD/MM/YYYY"); return; }
      document.getElementById('btnEnviar').disabled = true;
      mensajeForm.textContent = "Escribiendo en Google Sheets...";
      mensajeForm.style.color = "#2c3e50";

      const payload = {
        titular: selectTitular.value,
        nombreasistente: document.getElementById('nombreasistente').value,
        rut: document.getElementById('rut').value,
        fechanacimiento: inputFecha.value,
        edad: parseInt(inputEdad.value, 10),
        restriccionalimentaria: document.getElementById('restriccionalimentaria').value,
        observaciones: document.getElementById('observaciones').value
      };

      try {
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        mensajeForm.textContent = "¡Asistente guardado con éxito!";
        mensajeForm.style.color = "green";
        form.reset();
        document.getElementById('restriccionalimentaria').value = "Ninguna";
      } catch (error) {
        mensajeForm.textContent = "Error al intentar guardar el registro.";
        mensajeForm.style.color = "red";
      } finally {
        document.getElementById('btnEnviar').disabled = false;
      }
    });

    window.addEventListener('DOMContentLoaded', cargarPantallaPrincipal);
  </script>
</body>
</html>
