<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Asistentes</title>
  
  <!-- CSS de DataTables y Diseño moderno -->
  <link rel="stylesheet" href="https://datatables.net">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
    
    /* El contenedor principal ocupa hasta 1000px, pero en pantallas chicas usa el 95% del ancho */
    .container { max-width: 1000px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin: 15px auto; box-sizing: border-box; }
    .hidden { display: none !important; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f1f1f1; gap: 10px; }
    h2 { margin: 0; color: #2c3e50; font-size: 18px; }
    
    /* Botones compactos */
    .btn { padding: 6px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .btn-main { background-color: #007bff; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-main:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; width: 100%; padding: 12px; font-size: 15px; justify-content: center; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-info { background-color: #17a2b8; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-info:hover { background-color: #138496; }
    .acciones-td { display: flex; justify-content: flex-end; gap: 6px; }
    
    /* 📱 MEJORA RESPONSIVE: Forzar ancho total y permitir scroll horizontal si es necesario */
    #contenedorTabla { width: 100% !important; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
    table.dataTable { width: 100% !important; margin: 0 !important; border-bottom: 1px solid #eef2f5 !important; }
    .dataTables_wrapper { width: 100% !important; margin: 0 auto; }
    
    table.dataTable tbody th, table.dataTable tbody td { padding: 10px 12px !important; font-size: 13px; border-bottom: 1px solid #eef2f5; }
    table.dataTable thead th { background-color: #f8f9fa !important; color: #5a6c7d !important; font-weight: 600 !important; font-size: 11px !important; text-transform: uppercase; border-bottom: 1px solid #cbd5e0 !important; padding: 10px 12px !important; }
    
    .dataTables_wrapper .dataTables_filter input { padding: 5px 10px; border: 1px solid #cbd5e0; border-radius: 6px; margin-left: 8px; font-size: 13px; }
    .dataTables_wrapper .dataTables_length select { padding: 4px; border-radius: 4px; }
    
    .badge { background-color: #007bff; color: white; padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: bold; }
    .badge-vacio { background-color: #6c757d; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #4a5568; }
    select, input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 800px; width: 90%; max-height: 75vh; overflow-y: auto; box-sizing: border-box; }
    .status-msg { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    
    /* Ajustes extra para pantallas muy pequeñas (Celulares) */
    @media (max-width: 480px) {
      body { padding: 5px; }
      .container { padding: 15px; border-radius: 8px; }
      .header-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .dataTables_wrapper .dataTables_filter { float: none; text-align: left; margin-bottom: 10px; }
      .dataTables_wrapper .dataTables_filter input { width: 100%; margin-left: 0; margin-top: 5px; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LISTADO PRINCIPAL CON DATATABLE RESPONSIVE -->
  <div id="vistaPrincipal" class="container">
    <div class="header-row">
      <h2>Listado General de Titulares</h2>
    </div>
    
    <div id="cargaPrincipal" class="status-msg">Sincronizando con Google Sheets...</div>
    
    <!-- El div contenedor ahora previene desbordamientos -->
    <div id="contenedorTabla" class="hidden">
      <table id="tablaTitulares" class="display cell-border hover compact">
        <thead>
          <tr>
            <th>Nombre del Titular</th>
            <th style="text-align: center;">Registros</th>
            <th style="text-align: right; padding-right: 25px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTitulares"></tbody>
      </table>
    </div>
  </div>

  <!-- PANTALLA 2: FORMULARIO -->
  <div id="vistaFormulario" class="container hidden">
    <div class="header-row">
      <h2>Nuevo Registro de Asistente</h2>
      <button class="btn btn-secondary" id="btnVolver">⬅ Volver</button>
    </div>
    <form id="formularioRegistro">
      <div class="form-group">
        <label for="titular">Titular Responsable:</label>
        <select id="titular" required></select>
      </div>
      <div class="form-group">
        <label for="nombreasistente">Nombre del Asistente:</label>
        <input type="text" id="nombreasistente" required placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label for="fechanacimiento">Fecha de Nacimiento:</label>
        <input type="text" id="fechanacimiento" required placeholder="DD/MM/YYYY" maxlength="10">
      </div>
      <div class="form-group">
        <label for="edad">Edad Calculada:</label>
        <input type="number" id="edad" required readonly placeholder="Se calcula sola mediante la fecha">
      </div>
      <div class="form-group">
        <label for="restriccionalimentaria">Restricción Alimentaria:</label>
        <select id="restriccionalimentaria" required>
          <option value="Ninguna">Ninguna</option>
          <option value="Vegetariano">Vegetariano</option>
          <option value="Vegano">Vegano</option>
          <option value="Celíaco (Sin gluten)">Celíaco (Sin gluten)</option>
          <option value="Intolerante a la lactosa">Intolerante a la lactosa</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" rows="2" placeholder="Detalles..."></textarea>
      </div>
      <button type="submit" class="btn btn-success" id="btnEnviar">💾 Guardar Registro</button>
    </form>
    <div id="mensajeForm" class="status-msg"></div>
  </div>

  <!-- POP-UP FLOTANTE (DETALLE DE INVITADOS RESPONSIVE) -->
  <div id="modalInvitados" class="modal hidden">
    <div class="modal-content">
      <div class="header-row" style="border-bottom: 1px solid #eee; margin-bottom: 10px;">
        <h3 id="modalTitulo" style="margin:0; font-size:16px;">Invitados</h3>
        <button class="btn btn-secondary" id="btnCerrarModal" style="padding: 3px 8px;">Cerrar</button>
      </div>
      <div id="cuerpoModal" style="overflow-x: auto;">Cargando...</div>
    </div>
  </div>

  <!-- Scripts Obligatorios de jQuery y DataTables -->
  <script src="https://jquery.com"></script>
  <script src="https://datatables.net"></script>

    <script>
    // ⚠️ REEMPLAZA ESTA URL CON TU ENLACE ACTIVO DE APPS SCRIPT (/exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHt7duhIvgkBgATzfuc7lkdq0HwYahFtLUmNzXxMOnPOdT-CHdHhqmuOtmacz8YwAi/exec";

    const vistaPrincipal = document.getElementById('vistaPrincipal');
    const vistaFormulario = document.getElementById('vistaFormulario');
    const modalInvitados = document.getElementById('modalInvitados');
    const cuerpoTitulares = document.getElementById('cuerpoTitulares');
    const contenedorTabla = document.getElementById('contenedorTabla');
    const cargaPrincipal = document.getElementById('cargaPrincipal');
    const selectTitular = document.getElementById('titular');
    const inputFecha = document.getElementById('fechanacimiento');
    const inputEdad = document.getElementById('edad');
    const form = document.getElementById('formularioRegistro');
    const mensajeForm = document.getElementById('mensajeForm');
    
    let tablaDT = null;

    function irAAgregarConTitular(nombreTitular) {
      vistaPrincipal.classList.add('hidden');
      vistaFormulario.classList.remove('hidden');
      mensajeForm.textContent = "";
      selectTitular.value = nombreTitular;
    }

    document.getElementById('btnVolver').addEventListener('click', () => {
      vistaFormulario.classList.add('hidden');
      vistaPrincipal.classList.remove('hidden');
      cargarPantallaPrincipal(); 
    });

    document.getElementById('btnCerrarModal').addEventListener('click', () => {
      modalInvitados.classList.add('hidden');
    });

    // MÁSCARA FECHA Y EDAD AUTOMÁTICA
    inputFecha.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, ''); 
      if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
      if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
      e.target.value = v;
      if (v.length === 10) calcularEdadAutomatica(v);
      else inputEdad.value = ""; 
    });

    function calcularEdadAutomatica(fechaTexto) {
      const partes = fechaTexto.split('/');
      const dia = parseInt(partes[0], 10);
      const mes = parseInt(partes[1], 10) - 1;
      const ano = parseInt(partes[2], 10);
      if (isNaN(dia) || isNaN(mes) || isNaN(ano) || ano < 1900 || mes > 11 || dia > 31) return;
      
      const hoy = new Date();
      const cumpleanos = new Date(ano, mes, dia);
      let edadCalculada = hoy.getFullYear() - cumpleanos.getFullYear();
      const m = hoy.getMonth() - cumpleanos.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < cumpleanos.getDate())) { edadCalculada--; }
      inputEdad.value = edadCalculada >= 0 ? edadCalculada : "";
    }

    // CARGAR PANTALLA PRINCIPAL E INICIALIZAR DATATABLE
    async function cargarPantallaPrincipal() {
      try {
        cargaPrincipal.classList.remove('hidden');
        cargaPrincipal.textContent = "Sincronizando con Google Sheets...";
        contenedorTabla.classList.add('hidden');

        if (tablaDT) {
          tablaDT.destroy();
          tablaDT = null;
        }

        const respuesta = await fetch(WEB_APP_URL);
        const res = await respuesta.json();
        
        cuerpoTitulares.innerHTML = "";
        const listaDatos = res.datos || [];

        listaDatos.forEach(titular => {
          const fila = document.createElement('tr');
          const tieneInvitados = titular.cantidad > 0;
          // SE REMOVIÓ EL MARCADOR DE NEGRITA EN EL NOMBRE DEL TITULAR
          fila.innerHTML = `
            <td>${titular.nombre}</td>
            <td style="text-align: center;"><span class="badge ${tieneInvitados ? '' : 'badge-vacio'}">${titular.cantidad}</span></td>
            <td style="text-align: right;">
              <div class="acciones-td">
                <button class="btn btn-main" onclick="irAAgregarConTitular('${titular.nombre}')">➕ Agregar</button>
                <button class="btn btn-info" onclick="verInvitados('${titular.nombre}')">👁️ Ver</button>
              </div>
            </td>
          `;
          cuerpoTitulares.appendChild(fila);
        });

        selectTitular.innerHTML = '<option value="">-- Seleccione un Titular --</option>';
        listaDatos.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.nombre; opt.textContent = t.nombre;
          selectTitular.appendChild(opt);
        });

        cargaPrincipal.classList.add('hidden');
        contenedorTabla.classList.remove('hidden');

        tablaDT = $('#tablaTitulares').DataTable({
          pageLength: 10,
          lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "Todos"]],
          destroy: true,
          language: {
            processing: "Procesando...",
            search: "Buscar titular:",
            lengthMenu: "Mostrar _MENU_ registros",
            info: "Mostrando _START_ a _END_ de _TOTAL_ titulares",
            infoEmpty: "Mostrando 0 a 0 de 0 registros",
            infoFiltered: "(filtrado de un total de _MAX_ registros)",
            loadingRecords: "Cargando datos...",
            zeroRecords: "No se encontraron resultados",
            emptyTable: "Ningún dato disponible en esta tabla",
            paginate: { first: "Primero", previous: "Anterior", next: "Siguiente", last: "Último" }
          }
        });

      } catch (error) {
        cargaPrincipal.textContent = "Error de comunicación con el Apps Script.";
      }
    }

    // VER DETALLE CON FORMATO DE FECHA DD/MM/YYYY (TEXTO NORMAL)
    async function verInvitados(nombreTitular) {
      document.getElementById('modalTitulo').innerHTML = `Invitados de: <span style="color:#007bff; font-weight:normal;">${nombreTitular}</span>`;
      const cuerpoModal = document.getElementById('cuerpoModal');
      cuerpoModal.innerHTML = "Buscando coincidencias...";
      modalInvitados.classList.remove('hidden');

      try {
        const respuesta = await fetch(`${WEB_APP_URL}?titular=${encodeURIComponent(nombreTitular)}`);
        const res = await respuesta.json();

        if (!res.invitados || res.invitados.length === 0) {
          cuerpoModal.innerHTML = "<p style='text-align:center;color:#718096;padding:10px;font-size:13px;'>Sin invitados registrados en Hoja2.</p>";
          return;
        }

        let htmlTabla = `<table><thead><tr><th>Asistente / Edad</th><th>Fecha Nacimiento</th><th>Restricción</th></tr></thead><tbody>`;
        res.invitados.forEach(inv => {
          let fNacimientoStr = inv.fechanacimiento || "No registrada";
          
          if (fNacimientoStr.includes("T")) {
            const partesIso = fNacimientoStr.split("T")[0].split("-");
            if(partesIso.length === 3) fNacimientoStr = `${partesIso[2]}/${partesIso[1]}/${partesIso[0]}`;
          }

          // SE REMOVIÓ EL MARCADOR DE NEGRITA EN EL NOMBRE DEL ASISTENTE
          htmlTabla += `<tr>
            <td>${inv.nombreasistente}<br><small style="color:#718096">Edad: ${inv.edad} años</small></td>
            <td><code>${fNacimientoStr}</code></td>
            <td>${inv.restriccionalimentaria}${inv.observaciones ? `<br><small style="color:#e53e3e">Obs: ${inv.observaciones}</small>` : ''}</td>
          </tr>`;
        });
        htmlTabla += `</tbody></table>`;
        cuerpoModal.innerHTML = htmlTabla;
      } catch (e) {
        cuerpoModal.innerHTML = "Error al decodificar la lista.";
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (inputFecha.value.length < 10) { alert("Completa la fecha en formato DD/MM/YYYY"); return; }
      document.getElementById('btnEnviar').disabled = true;
      mensajeForm.textContent = "Escribiendo en Google Sheets...";

      const payload = {
        titular: selectTitular.value,
        nombreasistente: document.getElementById('nombreasistente').value,
        fechanacimiento: inputFecha.value,
        edad: parseInt(inputEdad.value, 10),
        restriccionalimentaria: document.getElementById('restriccionalimentaria').value,
        observaciones: document.getElementById('observaciones').value
      };

      try {
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        mensajeForm.textContent = "¡Asistente guardado con éxito!";
        mensajeForm.style.color = "green";
        form.reset();
        document.getElementById('restriccionalimentaria').value = "Ninguna";
      } catch (error) {
        mensajeForm.textContent = "Error al intentar guardar.";
        mensajeForm.style.color = "red";
      } finally {
        document.getElementById('btnEnviar').disabled = false;
      }
    });

    window.addEventListener('DOMContentLoaded', cargarPantallaPrincipal);
  </script>
</body>
</html>
