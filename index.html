<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Asistentes</title>
  
  <style>
    /* 🛠️ ESTILOS NATIVOS LOCALES DE DATATABLES */
    .dataTables_wrapper { position: relative; clear: both; margin: 15px 0 !important; width: 100% !important; font-size: 13px; }
    .dataTables_length { float: left; margin-bottom: 15px; }
    .dataTables_filter { float: right; text-align: right; margin-bottom: 15px; }
    .dataTables_filter input { padding: 6px 10px; border: 1px solid #cbd5e0; border-radius: 6px; margin-left: 8px; font-size: 13px; }
    .dataTables_length select { padding: 5px; border-radius: 4px; border: 1px solid #cbd5e0; }
    table.dataTable { width: 100% !important; clear: both; border-collapse: collapse; margin: 0 auto !important; }
    table.dataTable thead th { background-color: #f8f9fa !important; color: #5a6c7d !important; font-weight: 600 !important; font-size: 11px !important; text-transform: uppercase; border-bottom: 2px solid #cbd5e0 !important; padding: 10px 12px !important; text-align: left; }
    table.dataTable tbody td { padding: 10px 12px !important; border-bottom: 1px solid #eef2f5; }
    table.dataTable tbody tr:hover { background-color: #fafbfc; }

    /* 📄 DISEÑO DE BOTONES DE PAGINACIÓN INTERACTIVOS CORREGIDO */
    .dataTables_paginate { display: inline-flex; align-items: center; gap: 4px; padding-top: 15px; user-select: none; }
    .dataTables_paginate .paginate_button { 
      display: inline-block; 
      padding: 6px 12px; 
      border: 1px solid #e2e8f0; 
      border-radius: 6px; 
      background-color: #ffffff; 
      color: #4a5568 !important; 
      font-size: 12px; 
      font-weight: 600; 
      text-decoration: none !important; 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }
    .dataTables_paginate .paginate_button.current { 
      background-color: #007bff; 
      color: #ffffff !important; 
      border-color: #007bff; 
    }
    .dataTables_paginate .paginate_button:not(.current):not(.disabled):hover { 
      background-color: #edf2f7; 
      border-color: #cbd5e0; 
      color: #2d3748 !important; 
    }
    .dataTables_paginate .paginate_button.disabled { 
      cursor: not-allowed; 
      color: #a0aec0 !important; 
      border-color: #edf2f7; 
      background-color: #f7fafc; 
    }

    /* 🎨 DISEÑO AMPLIO Y ADAPTATIVO */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1000px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin: 15px auto; box-sizing: border-box; }
    .hidden { display: none !important; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f1f1f1; gap: 10px; }
    h2 { margin: 0; color: #2c3e50; font-size: 18px; }
    
    .btn { padding: 6px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .btn-main { background-color: #007bff; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-main:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; width: 100%; padding: 12px; font-size: 15px; justify-content: center; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-info { background-color: #17a2b8; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-info:hover { background-color: #138496; }
    .btn-danger { background-color: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #bd2130; }
    .acciones-td { display: flex; justify-content: flex-end; gap: 6px; }
    
    #contenedorTabla { width: 100% !important; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
    .badge { background-color: #007bff; color: white; padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: bold; }
    .badge-vacio { background-color: #6c757d; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #4a5568; }
    select, input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 800px; width: 90%; max-height: 75vh; overflow-y: auto; box-sizing: border-box; }
    .status-msg { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    
    @media (max-width: 480px) {
      body { padding: 5px; }
      .container { padding: 15px; border-radius: 8px; }
      .header-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .dataTables_wrapper .dataTables_filter { float: none; text-align: left; margin-bottom: 10px; }
      .dataTables_wrapper .dataTables_filter input { width: 100%; margin-left: 0; margin-top: 5px; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LISTADO PRINCIPAL -->
  <div id="vistaPrincipal" class="container">
    <div class="header-row">
      <h2>Listado General de Titulares</h2>
    </div>
    
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
      <div>
        <label style="display:inline-block; font-weight:normal; font-size:13px;">Mostrar 
          <select id="controlLimite" style="width:auto; display:inline-block; padding: 4px;">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="-1">Todos</option>
          </select> registros
        </label>
      </div>
      <div>
        <label style="font-weight:normal; font-size:13px;">Buscar titular: 
          <input type="text" id="buscadorManual" style="width:200px; display:inline-block; padding: 5px 10px;" placeholder="Escribe para filtrar...">
        </label>
      </div>
    </div>
    
    <div id="cargaPrincipal" class="status-msg">Sincronizando con Google Sheets...</div>
    
    <div id="contenedorTabla" class="hidden">
      <table id="tablaTitulares" class="dataTable">
        <thead>
          <tr>
            <th>Nombre del Titular</th>
            <th style="text-align: center;">Registros</th>
            <th style="text-align: right; padding-right: 25px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTitulares"></tbody>
      </table>
      
      <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div id="infoTabla" style="color: #718096; font-size: 13px;">Mostrando registros</div>
        <div id="paginacionTabla" class="dataTables_paginate"></div>
      </div>
    </div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DE REGISTRO / EDICIÓN -->
  <div id="vistaFormulario" class="container hidden">
    <div class="header-row">
      <h2 id="tituloFormulario">Nuevo Registro de Asistente</h2>
      <button class="btn btn-secondary" id="btnVolver">⬅ Volver</button>
    </div>
    <form id="formularioRegistro">
      <!-- CAMPO OCULTO PARA ALMACENAR EL ID DE LA FILA EN CASO DE EDICIÓN -->
      <input type="hidden" id="idFilaEditando" value="">

      <div class="form-group">
        <label for="titular">Titular Responsable:</label>
        <select id="titular" required></select>
      </div>
      <div class="form-group">
        <label for="nombreasistente">Nombre del Asistente:</label>
        <input type="text" id="nombreasistente" required placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label for="fechanacimiento">Fecha de Nacimiento:</label>
        <input type="text" id="fechanacimiento" required placeholder="DD/MM/YYYY" maxlength="10">
      </div>
      <div class="form-group">
        <label for="edad">Edad Calculada:</label>
        <input type="number" id="edad" required readonly placeholder="Se calcula sola mediante la fecha">
      </div>
      <div class="form-group">
        <label for="restriccionalimentaria">Restricción Alimentaria:</label>
        <select id="restriccionalimentaria" required>
          <option value="Ninguna">Ninguna</option>
          <option value="Vegetariano">Vegetariano</option>
          <option value="Vegano">Vegano</option>
          <option value="Celíaco (Sin gluten)">Celíaco (Sin gluten)</option>
          <option value="Intolerante a la lactosa">Intolerante a la lactosa</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" rows="2" placeholder="Detalles..."></textarea>
      </div>
      <button type="submit" class="btn btn-success" id="btnEnviar">💾 Guardar Registro</button>
    </form>
    <div id="mensajeForm" class="status-msg"></div>
  </div>

  <!-- POP-UP FLOTANTE (MODAL REGISTROS) -->
  <div id="modalInvitados" class="modal hidden">
    <div class="modal-content">
      <div class="header-row" style="border-bottom: 1px solid #eee; margin-bottom: 10px;">
        <h3 id="modalTitulo" style="margin:0; font-size:16px;">Invitados</h3>
        <button class="btn btn-secondary" id="btnCerrarModal" style="padding: 3px 8px;">Cerrar</button>
      </div>
      <div id="cuerpoModal" style="overflow-x: auto;">Cargando...</div>
    </div>
  </div>

  <!-- ⚙️ LÓGICA DE CONTROLADORES JAVASCRIPT -->
  <script>
    // ESTADO GLOBAL DE DATOS
    let datosTitulares = [];
    let titularesFiltrados = [];
    let registrosModalActuales = [];
    let paginaActual = 1;
    let registrosPorPagina = 10;

    // ELEMENTOS DOM
    const inputFecha = document.getElementById('fechanacimiento');
    const inputEdad = document.getElementById('edad');
    const form = document.getElementById('formularioRegistro');
    const selectTitular = document.getElementById('titular');
    const modal = document.getElementById('modalInvitados');

    // AL CARGAR LA PÁGINA INICIALIZAR EVENTOS Y DATOS
    document.addEventListener('DOMContentLoaded', () => {
      cargarDatosIniciales();

      // MÁSCARA Y CÁLCULO DE EDAD AUTOMÁTICO
      inputFecha.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, ''); 
        if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
        if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
        e.target.value = v;

        if (v.length === 10) calcularEdadAutomatica(v);
        else inputEdad.value = ""; 
      });

      // EVENTOS DE NAVEGACIÓN Y ACCIONES
      document.getElementById('btnVolver').addEventListener('click', mostrarListaPrincipal);
      document.getElementById('btnCerrarModal').addEventListener('click', () => modal.classList.add('hidden'));
      document.getElementById('controlLimite').addEventListener('change', (e) => {
        registrosPorPagina = parseInt(e.target.value, 10);
        paginaActual = 1;
        renderizarTabla();
      });
      document.getElementById('buscadorManual').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        titularesFiltrados = datosTitulares.filter(t => t.nombre.toLowerCase().includes(query));
        paginaActual = 1;
        renderizarTabla();
      });

      // ENVÍO DEL FORMULARIO (GUARDAR O ACTUALIZAR)
      form.addEventListener('submit', guardarOActualizarFormulario);
    });

    // 1. CÁLCULO DE EDAD MEJORADO CON COMPROBACIÓN DE DÍAS REALES
    function calcularEdadAutomatica(fechaTexto) {
      const partes = fechaTexto.split('/');
      const dia = parseInt(partes[0], 10);
      const mes = parseInt(partes[1], 10) - 1;
      const ano = parseInt(partes[2], 10);

      if (isNaN(dia) || isNaN(mes) || isNaN(ano) || ano < 1900 || mes < 0 || mes > 11 || dia < 1 || dia > 31) {
        inputEdad.value = "";
        return;
      }

      const hoy = new Date();
      const cumpleanos = new Date(ano, mes, dia);

      if (cumpleanos.getFullYear() !== ano || cumpleanos.getMonth() !== mes || cumpleanos.getDate() !== dia) {
        inputEdad.value = "";
        return;
      }

      let edadCalculada = hoy.getFullYear() - cumpleanos.getFullYear();
      const m = hoy.getMonth() - cumpleanos.getMonth();

      if (m < 0 || (m === 0 && hoy.getDate() < cumpleanos.getDate())) {
        edadCalculada--;
      }

      inputEdad.value = edadCalculada >= 0 ? edadCalculada : "";
    }

    // 2. OBTENER DATOS DESDE APPS SCRIPT (O MODALIDAD DE PRUEBA LOCAL)
    function cargarDatosIniciales() {
      document.getElementById('cargaPrincipal').classList.remove('hidden');
      document.getElementById('contenedorTabla').classList.add('hidden');

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler(procesarRespuestaInicial)
          .withFailureHandler(mostrarErrorGlobal)
          .obtenerListaTitulares();
      } else {
        // MOCK DATA DE PRUEBA SI SE ABRE LOCALMENTE SIN APPS SCRIPT
        setTimeout(() => {
          const mockData = [
            { nombre: "Juan Pérez", totalRegistros: 2 },
            { nombre: "María García", totalRegistros: 0 },
            { nombre: "Carlos Rodríguez", totalRegistros: 1 }
          ];
          procesarRespuestaInicial(mockData);
        }, 800);
      }
    }

    function procesarRespuestaInicial(data) {
      datosTitulares = data;
      titularesFiltrados = [...datosTitulares];
      
      // Llenar combo desplegable del formulario
      selectTitular.innerHTML = '<option value="">-- Seleccionar Titular --</option>';
      datosTitulares.forEach(t => {
        const option = document.createElement('option');
        option.value = t.nombre;
        option.textContent = t.nombre;
        selectTitular.appendChild(option);
      });

      document.getElementById('cargaPrincipal').classList.add('hidden');
      document.getElementById('contenedorTabla').classList.remove('hidden');
      renderizarTabla();
    }

    // 3. RENDERIZAR TABLA Y PAGINACIÓN
    function renderizarTabla() {
      const tbody = document.getElementById('cuerpoTitulares');
      tbody.innerHTML = '';

      const total = titularesFiltrados.length;
      let inicio = 0;
      let fin = total;

      if (registrosPorPagina !== -1) {
        inicio = (paginaActual - 1) * registrosPorPagina;
        fin = Math.min(inicio + registrosPorPagina, total);
      }

      const paginados = titularesFiltrados.slice(inicio, fin);

      if (paginados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No se encontraron registros.</td></tr>';
      } else {
        paginados.forEach(t => {
          const tr = document.createElement('tr');
          const badgeClass = t.totalRegistros > 0 ? 'badge' : 'badge badge-vacio';
          
          tr.innerHTML = `
            <td><strong>${t.nombre}</strong></td>
            <td style="text-align: center;"><span class="${badgeClass}">${t.totalRegistros}</span></td>
            <td>
              <div class="acciones-td">
                <button class="btn btn-main" onclick="abrirFormularioNuevo('${t.nombre}')">➕ Agregar</button>
                <button class="btn btn-info" onclick="abrirModalRegistros('${t.nombre}')">👁️ Ver (${t.totalRegistros})</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Información de registros visibles
      document.getElementById('infoTabla').textContent = `Mostrando ${total === 0 ? 0 : inicio + 1} a ${fin} de ${total} registros`;
      construirPaginacion(total);
    }

    function construirPaginacion(totalRegistros) {
      const contenedorPaginas = document.getElementById('paginacionTabla');
      contenedorPaginas.innerHTML = '';

      if (registrosPorPagina === -1 || totalRegistros <= registrosPorPagina) return;

      const totalPaginas = Math.ceil(totalRegistros / registrosPorPagina);

      // Botón Anterior
      const btnAnt = document.createElement('a');
      btnAnt.className = `paginate_button ${paginaActual === 1 ? 'disabled' : ''}`;
      btnAnt.textContent = 'Anterior';
      btnAnt.onclick = () => { if (paginaActual > 1) { paginaActual--; renderizarTabla(); } };
      contenedorPaginas.appendChild(btnAnt);

      // Botones de Páginas
      for (let i = 1; i <= totalPaginas; i++) {
        const btnPage = document.createElement('a');
        btnPage.className = `paginate_button ${i === paginaActual ? 'current' : ''}`;
        btnPage.textContent = i;
        btnPage.onclick = () => { paginaActual = i; renderizarTabla(); };
        contenedorPaginas.appendChild(btnPage);
      }

      // Botón Siguiente
      const btnSig = document.createElement('a');
      btnSig.className = `paginate_button ${paginaActual === totalPaginas ? 'disabled' : ''}`;
      btnSig.textContent = 'Siguiente';
      btnSig.onclick = () => { if (paginaActual < totalPaginas) { paginaActual++; renderizarTabla(); } };
      contenedorPaginas.appendChild(btnSig);
    }

    // 4. ABRIR MODAL Y VER REGISTROS
    function abrirModalRegistros(nombreTitular) {
      document.getElementById('modalTitulo').textContent = `Registros Asignados a: ${nombreTitular}`;
      document.getElementById('cuerpoModal').innerHTML = '<div class="status-msg">Cargando registros...</div>';
      modal.classList.remove('hidden');

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler((registros) => renderizarTablaModal(registros, nombreTitular))
          .withFailureHandler((err) => {
            document.getElementById('cuerpoModal').innerHTML = `<span style="color:red;">Error: ${err.message}</span>`;
          })
          .obtenerRegistrosPorTitular(nombreTitular);
      } else {
        // Mock data para probar la UI
        setTimeout(() => {
          const mockRegistros = [
            { numFila: 2, titular: nombreTitular, nombre: "Asistente Ejemplo 1", fechaNacimiento: "15/05/2010", edad: 16, restriccion: "Ninguna", observaciones: "Sin comentarios" },
            { numFila: 3, titular: nombreTitular, nombre: "Asistente Ejemplo 2", fechaNacimiento: "20/08/2015", edad: 11, restriccion: "Vegetariano", observaciones: "Alergia a mani" }
          ];
          renderizarTablaModal(mockRegistros, nombreTitular);
        }, 500);
      }
    }

    function renderizarTablaModal(registros, nombreTitular) {
      registrosModalActuales = registros;
      const contenedor = document.getElementById('cuerpoModal');

      if (!registros || registros.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; padding:15px; color:#6c757d;">No hay asistentes registrados para este titular.</p>';
        return;
      }

      let html = `
        <table class="dataTable" style="margin-top:0;">
          <thead>
            <tr>
              <th>Asistente</th>
              <th>Fecha Nac.</th>
              <th>Edad</th>
              <th>Restricción</th>
              <th>Observaciones</th>
              <th style="text-align:center;">Acciones</th>
            </tr>
          </thead>
          <tbody>
      `;

      registros.forEach(r => {
        html += `
          <tr>
            <td><strong>${r.nombre}</strong></td>
            <td>${r.fechaNacimiento}</td>
            <td>${r.edad} años</td>
            <td>${r.restriccion}</td>
            <td>${r.observaciones || '-'}</td>
            <td style="text-align:center;">
              <div class="acciones-td" style="justify-content:center;">
                <button class="btn btn-info" onclick="prepararEdicion(${r.numFila})">✏️ Editar</button>
                <button class="btn btn-danger" onclick="eliminarRegistro(${r.numFila}, '${nombreTitular}')">🗑️ Eliminar</button>
              </div>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      contenedor.innerHTML = html;
    }

    // 5. EDITAR REGISTRO
    function prepararEdicion(numFila) {
      const registro = registrosModalActuales.find(r => r.numFila === numFila);
      if (!registro) return;

      document.getElementById('idFilaEditando').value = registro.numFila;
      selectTitular.value = registro.titular;
      document.getElementById('nombreasistente').value = registro.nombre;
      inputFecha.value = registro.fechaNacimiento;
      inputEdad.value = registro.edad;
      document.getElementById('restriccionalimentaria').value = registro.restriccion;
      document.getElementById('observaciones').value = registro.observaciones || '';

      // Cambiar interfaz a modo "Editar"
      document.getElementById('tituloFormulario').textContent = 'Editar Registro de Asistente';
      document.getElementById('btnEnviar').textContent = '🔄 Actualizar Registro';

      modal.classList.add('hidden');
      mostrarFormulario();
    }

    // 6. ELIMINAR REGISTRO
    function eliminarRegistro(numFila, nombreTitular) {
      if (confirm('¿Estás seguro de que deseas eliminar este asistente? Esta acción modificará tu Google Sheet.')) {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((res) => {
              alert(res);
              abrirModalRegistros(nombreTitular);
              cargarDatosIniciales();
            })
            .withFailureHandler((err) => alert('Error: ' + err.message))
            .eliminarRegistroEnSheet(numFila);
        } else {
          alert('Modo Local: Registro ' + numFila + ' eliminado ficticiamente.');
          registrosModalActuales = registrosModalActuales.filter(r => r.numFila !== numFila);
          renderizarTablaModal(registrosModalActuales, nombreTitular);
        }
      }
    }

    // 7. GUARDAR O ACTUALIZAR
    function guardarOActualizarFormulario(e) {
      e.preventDefault();
      const msg = document.getElementById('mensajeForm');
      msg.textContent = "Procesando...";
      msg.style.color = "#007bff";

      const numFila = document.getElementById('idFilaEditando').value;
      const payload = {
        numFila: numFila ? parseInt(numFila, 10) : null,
        titular: selectTitular.value,
        nombre: document.getElementById('nombreasistente').value,
        fechaNacimiento: inputFecha.value,
        edad: inputEdad.value,
        restriccion: document.getElementById('restriccionalimentaria').value,
        observaciones: document.getElementById('observaciones').value
      };

      if (typeof google !== 'undefined' && google.script) {
        google.script.run
          .withSuccessHandler((res) => {
            msg.textContent = res;
            msg.style.color = "green";
            setTimeout(() => {
              limpiarFormulario();
              mostrarListaPrincipal();
              cargarDatosIniciales();
            }, 1200);
          })
          .withFailureHandler((err) => {
            msg.textContent = "Error: " + err.message;
            msg.style.color = "red";
          })
          .guardarOActualizarRegistro(payload);
      } else {
        setTimeout(() => {
          msg.textContent = numFila ? "¡Registro actualizado con éxito (Local)!" : "¡Registro guardado con éxito (Local)!";
          msg.style.color = "green";
          setTimeout(() => {
            limpiarFormulario();
            mostrarListaPrincipal();
          }, 1000);
        }, 600);
      }
    }

    // NAVEGACIÓN Y LIMPIEZA
    function abrirFormularioNuevo(nombreTitular) {
      limpiarFormulario();
      selectTitular.value = nombreTitular;
      mostrarFormulario();
    }

    function mostrarFormulario() {
      document.getElementById('vistaPrincipal').classList.add('hidden');
      document.getElementById('vistaFormulario').classList.remove('hidden');
    }

    function mostrarListaPrincipal() {
      document.getElementById('vistaFormulario').classList.add('hidden');
      document.getElementById('vistaPrincipal').classList.remove('hidden');
      limpiarFormulario();
    }

    function limpiarFormulario() {
      form.reset();
      document.getElementById('idFilaEditando').value = '';
      document.getElementById('mensajeForm').textContent = '';
      document.getElementById('tituloFormulario').textContent = 'Nuevo Registro de Asistente';
      document.getElementById('btnEnviar').textContent = '💾 Guardar Registro';
    }

    function mostrarErrorGlobal(err) {
      document.getElementById('cargaPrincipal').textContent = "Error al conectar con Google Sheets: " + err.message;
      document.getElementById('cargaPrincipal').style.color = "red";
    }
  </script>
</body>
</html>
