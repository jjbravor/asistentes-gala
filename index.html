<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistentes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Inscripción de Asistentes</h2>
    <form id="asistenteForm">
        
        <label for="titular">Nombre del Titular (Clave de validación):</label>
        <input type="text" id="titular" required placeholder="Ej: Juan">
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <label for="asistente">Nombre Completo del Asistente:</label>
        <input type="text" id="asistente" required placeholder="Ej: Juan Bravo o María José">
        
        <label for="rut">RUT (con puntos y guion):</label>
        <input type="text" id="rut" required placeholder="Ej: 12.345.678-9">
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label for="fechaNac">Fecha de Nac.:</label>
                <input type="date" id="fechaNac" required>
            </div>
            <div style="flex: 1;">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" required min="0" placeholder="Ej: 28">
            </div>
        </div>
        
        <label for="restriccion">Restricción Alimentaria:</label>
        <select id="restriccion" required>
            <option value="Ninguna">Ninguna</option>
            <option value="Vegano">Vegano/a</option>
            <option value="Vegetariano">Vegetariano/a</option>
            <option value="Celiaco (Sin Gluten)">Celíaco (Sin Gluten)</option>
            <option value="Intolerante Lactosa">Intolerante a la Lactosa</option>
            <option value="Otro">Otro (Especificar en observaciones)</option>
        </select>
        
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" placeholder="Detalles adicionales o alergias específicas..."></textarea>
        
        <button type="submit" id="submitBtn">Registrar Asistente</button>
    </form>
</div>

<script>
    // REEMPLAZA ESTA URL CON TU URL DE APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    const url = "TU_URL_DE_APPS_SCRIPT_AQUI"; 

    document.getElementById("asistenteForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerText = "Validando y Guardando...";

        const data = {
            titular: document.getElementById("titular").value,
            asistente: document.getElementById("asistente").value,
            rut: document.getElementById("rut").value,
            fechaNac: document.getElementById("fechaNac").value,
            edad: document.getElementById("edad").value,
            restriccion: document.getElementById("restriccion").value,
            observaciones: document.getElementById("observaciones").value || "Ninguna"
        };

        fetch(url, {
            method: "POST",
            mode: "cors",
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(response => {
            if(response.result === "success") {
                alert("¡Asistente registrado con éxito!");
                // Limpia el formulario manteniendo el titular por si añade otro asistente
                document.getElementById("asistente").value = "";
                document.getElementById("rut").value = "";
                document.getElementById("fechaNac").value = "";
                document.getElementById("edad").value = "";
                document.getElementById("restriccion").value = "Ninguna";
                document.getElementById("observaciones").value = "";
            } else {
                alert("Error: " + response.message);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Error de red o de permisos al conectar con el servidor.");
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Registrar Asistente";
        });
    });
</script>

</body>
</html>
