<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Asistentes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .form-container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    .status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Registro de Asistentes</h2>
    <form id="formularioRegistro">
      
      <div class="form-group">
        <label for="titular">Titular (Combo Hoja1):</label>
        <select id="titular" required>
          <option value="">Cargando lista...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nombreasistente">Nombre del Asistente:</label>
        <input type="text" id="nombreasistente" required placeholder="Nombre completo">
      </div>

      <div class="form-group">
        <label for="rut">RUT:</label>
        <input type="text" id="rut" required placeholder="12.345.678-9">
      </div>

      <div class="form-group">
        <label for="fechanacimiento">Fecha de Nacimiento (DD/MM/YYYY):</label>
        <input 
          type="text" 
          id="fechanacimiento" 
          required 
          placeholder="DD/MM/YYYY" 
          maxlength="10"
          pattern="(0[1-9]|[0-9]|3)/(0[1-9]|1)/[0-9]{4}"
          title="El formato debe ser DD/MM/YYYY (ej: 25/11/1995)"
        >
      </div>

      <div class="form-group">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" required min="0" max="120" placeholder="Años">
      </div>

      <!-- AQUÍ SE CAMBIÓ A UN COMBO DESPLEGABLE -->
      <div class="form-group">
        <label for="restriccionalimentaria">Restricción Alimentaria:</label>
        <select id="restriccionalimentaria" required>
          <option value="Ninguna">Ninguna</option>
          <option value="Vegetariano">Vegetariano</option>
          <option value="Vegano">Vegano</option>
          <option value="Celíaco (Sin gluten)">Celíaco (Sin gluten)</option>
          <option value="Intolerante a la lactosa">Intolerante a la lactosa</option>
          <option value="Alergia alimentaria (APLV, frutos secos, etc.)">Alergia alimentaria</option>
          <option value="Otro">Otro (Especificar en observaciones)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" rows="3" placeholder="Detalles adicionales o alergias específicas..."></textarea>
      </div>

      <button type="submit" id="btnEnviar" disabled>Guardar Registro</button>
    </form>

    <div id="mensaje" class="status-msg"></div>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TU URL DE APPS SCRIPT (LA QUE TERMINA EN /exec)
    const WEB_APP_URL = "https://google.com";

    const selectTitular = document.getElementById('titular');
    const form = document.getElementById('formularioRegistro');
    const btnEnviar = document.getElementById('btnEnviar');
    const mensajeDiv = document.getElementById('mensaje');
    const inputFecha = document.getElementById('fechanacimiento');
    const selectRestriccion = document.getElementById('restriccionalimentaria');

    // 1. MÁSCARA AUTOMÁTICA PARA LA FECHA
    inputFecha.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, ''); 
      if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
      if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
      e.target.value = v;
    });

    // 2. CARGAR TITULARES AL INICIAR LA PÁGINA
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const respuesta = await fetch(WEB_APP_URL);
        const datos = await respuesta.json();
        if (datos.error) throw new Error(datos.error);

        selectTitular.innerHTML = '<option value="">-- Seleccione un Titular --</option>';
        datos.asistentes.forEach(nombre => {
          const option = document.createElement('option');
          option.value = nombre;
          option.textContent = nombre;
          selectTitular.appendChild(option);
        });
        btnEnviar.disabled = false;
      } catch (error) {
        selectTitular.innerHTML = '<option value="">Error al cargar la lista</option>';
        mensajeDiv.textContent = "Error de conexión con la planilla.";
        mensajeDiv.style.color = "red";
      }
    });

    // 3. ENVIAR DATOS A LA HOJA2
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnEnviar.disabled = true;
      mensajeDiv.textContent = "Enviando registro...";
      mensajeDiv.style.color = "#333";

      const payload = {
        titular: selectTitular.value,
        nombreasistente: document.getElementById('nombreasistente').value,
        rut: document.getElementById('rut').value,
        fechanacimiento: inputFecha.value,
        edad: parseInt(document.getElementById('edad').value),
        restriccionalimentaria: selectRestriccion.value, // Envía la opción seleccionada del combo
        observaciones: document.getElementById('observaciones').value
      };

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        mensajeDiv.textContent = "¡Registro guardado con éxito en Hoja2!";
        mensajeDiv.style.color = "green";
        form.reset();
        selectRestriccion.value = "Ninguna"; // Reinicia el combo a la opción por defecto
      } catch (error) {
        mensajeDiv.textContent = "Error al intentar guardar.";
        mensajeDiv.style.color = "red";
      } finally {
        btnEnviar.disabled = false;
      }
    });
  </script>
</body>
</html>
