<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Asistentes</title>
  
  <style>
    /* Estilos de la tabla de datos */
    .dataTables_wrapper { position: relative; clear: both; margin: 15px 0 !important; width: 100% !important; font-size: 13px; }
    .dataTables_length { float: left; margin-bottom: 15px; }
    .dataTables_filter { float: right; text-align: right; margin-bottom: 15px; }
    .dataTables_filter input { padding: 6px 10px; border: 1px solid #cbd5e0; border-radius: 6px; margin-left: 8px; font-size: 13px; }
    .dataTables_length select { padding: 5px; border-radius: 4px; border: 1px solid #cbd5e0; }
    table.dataTable { width: 100% !important; clear: both; border-collapse: collapse; margin: 0 auto !important; }
    table.dataTable thead th { background-color: #f8f9fa !important; color: #5a6c7d !important; font-weight: 600 !important; font-size: 11px !important; text-transform: uppercase; border-bottom: 2px solid #cbd5e0 !important; padding: 10px 12px !important; text-align: left; }
    table.dataTable tbody td { padding: 10px 12px !important; border-bottom: 1px solid #eef2f5; }
    table.dataTable tbody tr:hover { background-color: #fafbfc; }

    /* Paginación */
    .dataTables_paginate { display: inline-flex; align-items: center; gap: 4px; padding-top: 15px; user-select: none; }
    .dataTables_paginate .paginate_button { display: inline-block; padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 6px; background-color: #ffffff; color: #4a5568 !important; font-size: 12px; font-weight: 600; text-decoration: none !important; cursor: pointer; transition: all 0.2s ease; }
    .dataTables_paginate .paginate_button.current { background-color: #007bff; color: #ffffff !important; border-color: #007bff; }
    .dataTables_paginate .paginate_button:not(.current):not(.disabled):hover { background-color: #edf2f7; border-color: #cbd5e0; color: #2d3748 !important; }
    .dataTables_paginate .paginate_button.disabled { cursor: not-allowed; color: #a0aec0 !important; border-color: #edf2f7; background-color: #f7fafc; }

    /* Diseño General */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1000px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin: 15px auto; box-sizing: border-box; }
    .hidden { display: none !important; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #f1f1f1; gap: 10px; }
    h2 { margin: 0; color: #2c3e50; font-size: 18px; }
    
    /* Botones y Badges */
    .btn { padding: 6px 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .btn-main { background-color: #007bff; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-main:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; width: 100%; padding: 12px; font-size: 15px; justify-content: center; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-info { background-color: #17a2b8; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-info:hover { background-color: #138496; }
    .btn-warning { background-color: #ffc107; color: #212529; padding: 3px 6px; font-size: 11px; }
    .btn-danger { background-color: #dc3545; color: white; padding: 3px 6px; font-size: 11px; }
    .acciones-td { display: flex; justify-content: flex-end; gap: 6px; }
    
    #contenedorTabla { width: 100% !important; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
    .badge { background-color: #007bff; color: white; padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: bold; }
    .badge-vacio { background-color: #6c757d; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #4a5568; }
    select, input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    
    /* Modal Flotante */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 850px; width: 90%; max-height: 80vh; overflow-y: auto; box-sizing: border-box; }
    .status-msg { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    
    @media (max-width: 480px) {
      body { padding: 5px; }
      .container { padding: 15px; border-radius: 8px; }
      .header-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .dataTables_wrapper .dataTables_filter { float: none; text-align: left; margin-bottom: 10px; }
      .dataTables_wrapper .dataTables_filter input { width: 100%; margin-left: 0; margin-top: 5px; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LISTADO PRINCIPAL DE TITULARES -->
  <div id="vistaPrincipal" class="container">
    <div class="header-row">
      <h2>Listado General de Titulares</h2>
    </div>
    
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
      <div>
        <label style="display:inline-block; font-weight:normal; font-size:13px;">Mostrar 
          <select id="controlLimite" style="width:auto; display:inline-block; padding: 4px;">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="-1">Todos</option>
          </select> registros
        </label>
      </div>
      <div>
        <label style="font-weight:normal; font-size:13px;">Buscar titular: 
          <input type="text" id="buscadorManual" style="width:200px; display:inline-block; padding: 5px 10px;" placeholder="Escribe para filtrar...">
        </label>
      </div>
    </div>
    
    <div id="cargaPrincipal" class="status-msg">Sincronizando con Google Sheets...</div>
    
    <div id="contenedorTabla" class="hidden">
      <table id="tablaTitulares" class="dataTable">
        <thead>
          <tr>
            <th>Nombre del Titular</th>
            <th style="text-align: center;">Registros</th>
            <th style="text-align: right; padding-right: 25px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTitulares"></tbody>
      </table>
      
      <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div id="infoTabla" style="color: #718096; font-size: 13px;">Mostrando registros</div>
        <div id="paginacionTabla" class="dataTables_paginate"></div>
      </div>
    </div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DE REGISTRO/EDICIÓN -->
  <div id="vistaFormulario" class="container hidden">
    <div class="header-row">
      <h2 id="tituloFormulario">Nuevo Registro de Asistente</h2>
      <button class="btn btn-secondary" id="btnVolver">⬅ Volver</button>
    </div>
    <form id="formularioRegistro">
      <input type="hidden" id="numFila" value="">
      
      <div class="form-group">
        <label for="titular">Titular Responsable:</label>
        <select id="titular" required></select>
      </div>
      <div class="form-group">
        <label for="nombreasistente">Nombre del Asistente:</label>
        <input type="text" id="nombreasistente" required placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label for="fechanacimiento">Fecha de Nacimiento:</label>
        <input type="text" id="fechanacimiento" required placeholder="DD/MM/YYYY" maxlength="10">
      </div>
      <div class="form-group">
        <label for="edad">Edad Calculada:</label>
        <input type="number" id="edad" required readonly placeholder="Se calcula automáticamente">
      </div>
      <div class="form-group">
        <label for="restriccionalimentaria">Restricción Alimentaria:</label>
        <select id="restriccionalimentaria" required>
          <option value="Ninguna">Ninguna</option>
          <option value="Vegetariano">Vegetariano</option>
          <option value="Vegano">Vegano</option>
          <option value="Celíaco (Sin gluten)">Celíaco (Sin gluten)</option>
          <option value="Intolerante a la lactosa">Intolerante a la lactosa</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" rows="2" placeholder="Detalles o especificaciones..."></textarea>
      </div>
      <button type="submit" class="btn btn-success" id="btnEnviar">💾 Guardar Registro</button>
    </form>
    <div id="mensajeForm" class="status-msg"></div>
  </div>

  <!-- MODAL DE DETALLE Y GESTIÓN DE INVITADOS -->
  <div id="modalInvitados" class="modal hidden">
    <div class="modal-content">
      <div class="header-row" style="border-bottom: 1px solid #eee; margin-bottom: 10px;">
        <h3 id="modalTitulo" style="margin:0; font-size:16px;">Invitados</h3>
        <button class="btn btn-secondary" id="btnCerrarModal" style="padding: 3px 8px;">Cerrar</button>
      </div>
      <div id="cuerpoModal" style="overflow-x: auto;">Cargando...</div>
    </div>
  </div>

  <script>
    // URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "REEMPLAZAR_CON_TU_URL_DE_APPS_SCRIPT";

    const vistaPrincipal = document.getElementById('vistaPrincipal');
    const vistaFormulario = document.getElementById('vistaFormulario');
    const modalInvitados = document.getElementById('modalInvitados');
    const cuerpoTitulares = document.getElementById('cuerpoTitulares');
    const contenedorTabla = document.getElementById('contenedorTabla');
    const cargaPrincipal = document.getElementById('cargaPrincipal');
    const selectTitular = document.getElementById('titular');
    const inputFecha = document.getElementById('fechanacimiento');
    const inputEdad = document.getElementById('edad');
    const inputNumFila = document.getElementById('numFila');
    const form = document.getElementById('formularioRegistro');
    const mensajeForm = document.getElementById('mensajeForm');
    const tituloFormulario = document.getElementById('tituloFormulario');
    
    const buscadorManual = document.getElementById('buscadorManual');
    const controlLimite = document.getElementById('controlLimite');
    const infoTabla = document.getElementById('infoTabla');
    const paginacionTabla = document.getElementById('paginacionTabla');

    let datosOriginales = [];
    let datosFiltrados = [];
    let paginaActual = 1;
    let registrosPorPagina = 10;
    let titularActualModal = "";

    function irAAgregarConTitular(nombreTitular) {
      modalInvitados.classList.add('hidden');
      vistaPrincipal.classList.add('hidden');
      vistaFormulario.classList.remove('hidden');
      mensajeForm.textContent = "";
      
      form.reset();
      inputNumFila.value = "";
      tituloFormulario.textContent = "Nuevo Registro de Asistente";
      selectTitular.value = nombreTitular;
      selectTitular.disabled = false;
      document.getElementById('restriccionalimentaria').value = "Ninguna";
    }

    document.getElementById('btnVolver').addEventListener('click', () => {
      vistaFormulario.classList.add('hidden');
      vistaPrincipal.classList.remove('hidden');
      buscadorManual.value = "";
      cargarPantallaPrincipal(); 
    });

    // CERRAR MODAL Y REFRESCAR TABLA
    document.getElementById('btnCerrarModal').addEventListener('click', () => {
      modalInvitados.classList.add('hidden');
      cargarPantallaPrincipal();
    });

    modalInvitados.addEventListener('click', (e) => {
      if (e.target === modalInvitados) {
        modalInvitados.classList.add('hidden');
        cargarPantallaPrincipal();
      }
    });

    buscadorManual.addEventListener('input', () => {
      const termino = buscadorManual.value.toLowerCase().trim();
      datosFiltrados = datosOriginales.filter(t => t.nombre.toLowerCase().includes(termino));
      paginaActual = 1;
      procesarYRenderizarTabla();
    });

    controlLimite.addEventListener('change', () => {
      registrosPorPagina = parseInt(controlLimite.value, 10);
      paginaActual = 1;
      procesarYRenderizarTabla();
    });

    inputFecha.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, ''); 
      if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
      if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
      e.target.value = v;
      if (v.length === 10) calcularEdadAutomatica(v);
      else inputEdad.value = ""; 
    });

    function calcularEdadAutomatica(fechaTexto) {
      const partes = fechaTexto.split('/');
      const dia = parseInt(partes[0], 10);
      const mes = parseInt(partes[1], 10) - 1; 
      const ano = parseInt(partes[2], 10);

      if (isNaN(dia) || isNaN(mes) || isNaN(ano) || ano < 1900 || mes < 0 || mes > 11 || dia < 1 || dia > 31) {
        inputEdad.value = "";
        return;
      }

      const hoy = new Date();
      const cumpleanos = new Date(ano, mes, dia);

      if (cumpleanos.getFullYear() !== ano || cumpleanos.getMonth() !== mes || cumpleanos.getDate() !== dia) {
        inputEdad.value = "";
        return;
      }

      let edadCalculada = hoy.getFullYear() - cumpleanos.getFullYear();
      const m = hoy.getMonth() - cumpleanos.getMonth();

      if (m < 0 || (m === 0 && hoy.getDate() < cumpleanos.getDate())) { 
        edadCalculada--; 
      }

      inputEdad.value = edadCalculada >= 0 ? edadCalculada : "";
    }

    async function cargarPantallaPrincipal() {
      try {
        cargaPrincipal.classList.remove('hidden');
        cargaPrincipal.textContent = "Sincronizando con Google Sheets...";
        contenedorTabla.classList.add('hidden');

        const respuesta = await fetch(WEB_APP_URL);
        const res = await respuesta.json();
        
        datosOriginales = res.datos || [];
        datosFiltrados = [...datosOriginales];
        
        selectTitular.innerHTML = '<option value="">-- Seleccione un Titular --</option>';
        datosOriginales.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.nombre; 
          opt.textContent = t.nombre;
          selectTitular.appendChild(opt);
        });

        procesarYRenderizarTabla();
        
        cargaPrincipal.classList.add('hidden');
        contenedorTabla.classList.remove('hidden');

      } catch (error) {
        cargaPrincipal.textContent = "Error al conectar con Google Sheets. Revisa la URL ingresada.";
      }
    }

    function procesarYRenderizarTabla() {
      cuerpoTitulares.innerHTML = "";
      const totalRegistros = datosFiltrados.length;
      
      let limite = registrosPorPagina === -1 ? totalRegistros : registrosPorPagina;
      let inicio = (paginaActual - 1) * limite;
      let fin = inicio + limite;
      if (fin > totalRegistros) fin = totalRegistros;
      
      const datosPagina = datosFiltrados.slice(inicio, fin);

      if (datosPagina.length === 0) {
        cuerpoTitulares.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#718096;padding:15px;font-size:13px;">No se encontraron resultados</td></tr>`;
        infoTabla.textContent = "Mostrando 0 a 0 de 0 registros";
        paginacionTabla.innerHTML = "";
        return;
      }

      datosPagina.forEach(titular => {
        const fila = document.createElement('tr');
        const tieneInvitados = titular.cantidad > 0;
        fila.innerHTML = `
          <td>${titular.nombre}</td>
          <td style="text-align: center;"><span class="badge ${tieneInvitados ? '' : 'badge-vacio'}">${titular.cantidad}</span></td>
          <td style="text-align: right;">
            <div class="acciones-td">
              <button class="btn btn-main" onclick="irAAgregarConTitular('${titular.nombre.replace(/'/g, "\\'")}')">➕ Agregar</button>
              <button class="btn btn-info" onclick="verInvitados('${titular.nombre.replace(/'/g, "\\'")}')">👁️ Ver</button>
            </div>
          </td>
        `;
        cuerpoTitulares.appendChild(fila);
      });

      infoTabla.textContent = `Mostrando ${totalRegistros === 0 ? 0 : inicio + 1} a ${fin} de ${totalRegistros} titulares (filtrado de ${datosOriginales.length} totales)`;
      renderizarPaginacion(totalRegistros, limite);
    }

    function renderizarPaginacion(total, limite) {
      paginacionTabla.innerHTML = "";
      const paginasTotales = Math.ceil(total / limite);
      if (paginasTotales <= 1) return;

      const btnAnt = document.createElement('span');
      btnAnt.className = `paginate_button ${paginaActual === 1 ? 'disabled' : ''}`;
      btnAnt.textContent = "Anterior";
      if (paginaActual > 1) {
        btnAnt.onclick = () => { paginaActual--; procesarYRenderizarTabla(); };
      }
      paginacionTabla.appendChild(btnAnt);

      for (let i = 1; i <= paginasTotales; i++) {
        const btnPag = document.createElement('span');
        btnPag.className = `paginate_button ${paginaActual === i ? 'current' : ''}`;
        btnPag.textContent = i;
        btnPag.onclick = () => { paginaActual = i; procesarYRenderizarTabla(); };
        paginacionTabla.appendChild(btnPag);
      }

      const btnSig = document.createElement('span');
      btnSig.className = `paginate_button ${paginaActual === paginasTotales ? 'disabled' : ''}`;
      btnSig.textContent = "Siguiente";
      if (paginaActual < paginasTotales) {
        btnSig.onclick = () => { paginaActual++; procesarYRenderizarTabla(); };
      }
      paginacionTabla.appendChild(btnSig);
    }

    async function verInvitados(nombreTitular) {
      titularActualModal = nombreTitular;
      document.getElementById('modalTitulo').innerHTML = `Invitados de: <span style="color:#007bff; font-weight:normal;">${nombreTitular}</span>`;
      const cuerpoModal = document.getElementById('cuerpoModal');
      cuerpoModal.innerHTML = "Cargando registros...";
      modalInvitados.classList.remove('hidden');

      try {
        const respuesta = await fetch(`${WEB_APP_URL}?titular=${encodeURIComponent(nombreTitular)}`);
        const res = await respuesta.json();

        if (!res.invitados || res.invitados.length === 0) {
          cuerpoModal.innerHTML = "<p style='text-align:center;color:#718096;padding:10px;font-size:13px;'>Sin invitados registrados.</p>";
          return;
        }

        let htmlTabla = `
          <table style="width:100%; border-collapse:collapse;">
            <thead>
              <tr style="background:#f8f9fa;">
                <th style="padding:8px; border-bottom:2px solid #cbd5e0; font-size:12px; color:#5a6c7d;">Asistente / Edad</th>
                <th style="padding:8px; border-bottom:2px solid #cbd5e0; font-size:12px; color:#5a6c7d;">Fecha Nacimiento</th>
                <th style="padding:8px; border-bottom:2px solid #cbd5e0; font-size:12px; color:#5a6c7d;">Restricción</th>
                <th style="padding:8px; border-bottom:2px solid #cbd5e0; font-size:12px; color:#5a6c7d; text-align:right;">Acciones</th>
              </tr>
            </thead>
            <tbody>`;
            
        res.invitados.forEach(inv => {
          let fNacimientoStr = inv.fechanacimiento || "No registrada";
          
          if (fNacimientoStr.includes("T")) {
            const partesIso = fNacimientoStr.split("T")[0].split("-");
            if(partesIso.length === 3) fNacimientoStr = `${partesIso[2]}/${partesIso[1]}/${partesIso[0]}`;
          }

          const jsonInvData = JSON.stringify(inv).replace(/'/g, "&#39;");

          htmlTabla += `
            <tr>
              <td style="padding:8px; border-bottom:1px solid #eef2f5; font-size:13px;">
                <strong>${inv.nombreasistente}</strong><br>
                <small style="color:#718096">Edad: ${inv.edad} años</small>
              </td>
              <td style="padding:8px; border-bottom:1px solid #eef2f5; font-size:13px;"><code>${fNacimientoStr}</code></td>
              <td style="padding:8px; border-bottom:1px solid #eef2f5; font-size:13px;">
                ${inv.restriccionalimentaria}
                ${inv.observaciones ? `<br><small style="color:#e53e3e">Obs: ${inv.observaciones}</small>` : ''}
              </td>
              <td style="padding:8px; border-bottom:1px solid #eef2f5; font-size:13px; text-align:right;">
                <div style="display:flex; justify-content:flex-end; gap:4px;">
                  <button class="btn btn-warning" onclick='prepararEdicion(${jsonInvData})'>✏️ Editar</button>
                  <button class="btn btn-danger" onclick="confirmarEliminacion(${inv.numFila}, '${inv.nombreasistente.replace(/'/g, "\\'")}')">🗑️ Borrar</button>
                </div>
              </td>
            </tr>`;
        });
        
        htmlTabla += `</tbody></table>`;
        cuerpoModal.innerHTML = htmlTabla;
      } catch (e) {
        cuerpoModal.innerHTML = "Error al obtener la lista de invitados.";
      }
    }

    function prepararEdicion(invitado) {
      modalInvitados.classList.add('hidden');
      vistaPrincipal.classList.add('hidden');
      vistaFormulario.classList.remove('hidden');
      mensajeForm.textContent = "";

      tituloFormulario.textContent = "Editar Asistente";
      inputNumFila.value = invitado.numFila;
      selectTitular.value = invitado.titular;
      selectTitular.disabled = true;
      
      document.getElementById('nombreasistente').value = invitado.nombreasistente;
      document.getElementById('fechanacimiento').value = invitado.fechanacimiento;
      document.getElementById('edad').value = invitado.edad;
      document.getElementById('restriccionalimentaria').value = invitado.restriccionalimentaria;
      document.getElementById('observaciones').value = invitado.observaciones || "";
    }

    // ELIMINAR REGISTRO Y REFRESCAR TABLA EN SEGUNDO PLANO
    async function confirmarEliminacion(numFila, nombreAsistente) {
      if (!confirm(`¿Deseas eliminar el registro de "${nombreAsistente}"?`)) return;

      try {
        const cuerpoModal = document.getElementById('cuerpoModal');
        cuerpoModal.innerHTML = "Eliminando registro...";

        await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion: "ELIMINAR", numFila: numFila })
        });

        // Refresca la ventana modal actual
        await verInvitados(titularActualModal);
        
        // Refresca silenciosamente el listado principal de fondo
        fetch(WEB_APP_URL)
          .then(res => res.json())
          .then(res => {
            datosOriginales = res.datos || [];
            const termino = buscadorManual.value.toLowerCase().trim();
            datosFiltrados = datosOriginales.filter(t => t.nombre.toLowerCase().includes(termino));
            procesarYRenderizarTabla();
          });

      } catch (e) {
        alert("Error al intentar eliminar el registro.");
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (inputFecha.value.length < 10) { alert("Ingresa una fecha válida en formato DD/MM/YYYY"); return; }
      
      const btnEnviar = document.getElementById('btnEnviar');
      btnEnviar.disabled = true;
      mensajeForm.textContent = "Guardando cambios en Google Sheets...";

      const numFila = inputNumFila.value;
      const payload = {
        accion: numFila ? "ACTUALIZAR" : "GUARDAR",
        numFila: numFila ? parseInt(numFila, 10) : null,
        titular: selectTitular.value,
        nombreasistente: document.getElementById('nombreasistente').value,
        fechanacimiento: inputFecha.value,
        edad: parseInt(inputEdad.value, 10),
        restriccionalimentaria: document.getElementById('restriccionalimentaria').value,
        observaciones: document.getElementById('observaciones').value
      };

      try {
        await fetch(WEB_APP_URL, { 
          method: "POST", 
          headers: { "Content-Type": "text/plain;charset=utf-8" }, 
          body: JSON.stringify(payload) 
        });
        
        mensajeForm.textContent = "¡Operación completada con éxito!";
        mensajeForm.style.color = "green";
        
        setTimeout(() => {
          form.reset();
          inputNumFila.value = "";
          selectTitular.disabled = false;
          vistaFormulario.classList.add('hidden');
          vistaPrincipal.classList.remove('hidden');
          cargarPantallaPrincipal();
        }, 1200);

      } catch (error) {
        mensajeForm.textContent = "Error al procesar los datos.";
        mensajeForm.style.color = "red";
      } finally {
        btnEnviar.disabled = false;
      }
    });

    window.addEventListener('DOMContentLoaded', cargarPantallaPrincipal);
  </script>
</body>
</html>
